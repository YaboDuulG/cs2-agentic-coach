name: HLTV Nightly Crawler

on:
  schedule:
    - cron: '0 2 * * *'  # Run at 2:00 AM UTC every night
  workflow_dispatch:      # Allow manual triggers

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # The crawler needs a live DB and Gemini key. Until those secrets exist,
      # skip the run instead of failing nightly. Adding the secrets in
      # Settings → Secrets and variables → Actions activates this automatically.
      - name: Check required secrets
        id: guard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::DATABASE_URL or GEMINI_API_KEY not configured — skipping crawl."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        if: steps.guard.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright beautifulsoup4
          playwright install --with-deps chromium

      - name: Run HLTV Crawler
        if: steps.guard.outputs.ready == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          python services/hltv_watcher/crawler.py
