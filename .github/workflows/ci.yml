name: CI — Lint & Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, staging]

# Cancel superseded runs on the same branch — saves minutes during rapid iteration.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, type-check & unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CI dependencies
        # Minimal install — excludes heavy GCP/ML packages that break on fresh runners
        run: pip install -r requirements-ci.txt ruff mypy pytest pytest-asyncio

      - name: Lint (ruff)
        # Config from pyproject.toml — excludes frontend/, node_modules/
        run: ruff check .

      - name: Type check (mypy)
        # Config from pyproject.toml — excludes services/ and frontend/
        # || true: don't block CI on third-party stub warnings (langgraph, etc.)
        run: mypy agents/ api/ db/ || true

      - name: Run unit tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          LOCAL_MODE: "true"
          API_SHARED_SECRET: "ci-test-secret"
          GEMINI_API_KEY: "fake-key-for-tests"
          LANGCHAIN_TRACING_V2: "true"
          LANGCHAIN_PROJECT: "demosage-test"
          LANGCHAIN_API_KEY: "test-key"

  frontend:
    name: Frontend — lint, type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc)
        # tsconfig has strict:true — this is the main safety net during refactors
        run: npx tsc --noEmit

      - name: Build (next build)
        # Dummy values only: ClerkProvider in app/layout.tsx needs a well-formed
        # publishable key to prerender. Real keys live in Vercel, never in CI.
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_Y2xlcmsuY2kuZHVtbXkubGNsLmRldiQ="
          CLERK_SECRET_KEY: "sk_test_ci_dummy_value_not_a_real_secret"
          NEXT_PUBLIC_API_URL: "http://localhost:8080"
          BACKEND_URL: "http://localhost:8080"
        run: npm run build
