name: Bridge Sync

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install google-generativeai python-dotenv

      - name: Generate Spec with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd .bridge
          python3 handlers/gemini_gen.py

      - name: Sync Issues to GitHub
        if: hashFiles('.bridge/handlers/sync_tasks.py') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd .bridge
          python3 handlers/sync_tasks.py
