name: Qdrant Quota Check

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC nightly
  workflow_dispatch:

jobs:
  quota-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Skip cleanly until the Qdrant secrets are configured, rather than
      # failing every night. Adding them activates this check automatically.
      - name: Check required secrets
        id: guard
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          if [ -z "$QDRANT_URL" ] || [ -z "$QDRANT_API_KEY" ]; then
            echo "::warning::QDRANT_URL or QDRANT_API_KEY not configured — skipping quota check."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.ready == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.guard.outputs.ready == 'true'
        run: pip install qdrant-client python-dotenv

      - name: Check Qdrant vector quota
        if: steps.guard.outputs.ready == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          python -c "
          from db.qdrant_client import check_vector_quota
          result = check_vector_quota()
          print(result)
          if result['warning']:
              print('::warning::' + result['message'])
              raise SystemExit(1)
          "
