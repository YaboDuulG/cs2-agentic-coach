name: Qdrant Quota Check

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC nightly
  workflow_dispatch:

jobs:
  quota-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install qdrant-client python-dotenv
      - name: Check Qdrant vector quota
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          python -c "
          import os, sys
          if not os.environ.get('QDRANT_URL') or not os.environ.get('QDRANT_API_KEY'):
              print('::warning::QDRANT_URL or QDRANT_API_KEY not configured — skipping quota check')
              sys.exit(0)
          from db.qdrant_client import check_vector_quota
          result = check_vector_quota()
          print(result)
          if result['warning']:
              print('::warning::' + result['message'])
              sys.exit(1)
          "
